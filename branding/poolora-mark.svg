<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <!--
    Poolora brand mark: a carpool car on the road, under a location pin.
    Master artwork. Every PNG/WebP logo and icon in the repo is rendered
    from this file by scripts/generate_brand_assets.py, and
    frontend/src/components/PooloraLogo.tsx mirrors these shapes.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB400"/>
      <stop offset="0.5" stop-color="#FF4F6D"/>
      <stop offset="1" stop-color="#7B3FF2"/>
    </linearGradient>
    <linearGradient id="glass" x1="128" y1="100" x2="128" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FE0D2"/>
      <stop offset="1" stop-color="#0B7A75"/>
    </linearGradient>
  </defs>

  <g id="tile">
    <rect width="256" height="256" rx="56" fill="url(#bg)"/>
    <circle cx="214" cy="42" r="70" fill="#FFFFFF" fill-opacity="0.12"/>
  </g>

  <g id="car">
    <!-- road -->
    <path d="M16 198Q128 184 240 198L240 214Q128 200 16 214Z" fill="#1A1446" fill-opacity="0.45"/>
    <path d="M34 205Q128 192 222 205" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 11"/>

    <!-- speed lines -->
    <path d="M14 126H34" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M8 146H34" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M18 164H34" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- body -->
    <path d="M44 168V151Q44 139 56 137L92 132L111 106Q117 97 128 97H160Q170 97 177 105L197 128L205 130Q216 133 216 146V168Q216 178 206 178H54Q44 178 44 168Z" fill="#FFFFFF"/>
    <!-- windows -->
    <path d="M101 131L117 109Q121 104 128 104H140V131Z" fill="url(#glass)"/>
    <path d="M147 104H160Q166 104 171 110L187 131H147Z" fill="url(#glass)"/>
    <!-- passengers -->
    <circle cx="124" cy="117" r="6.5" fill="#1A1446"/>
    <path d="M113 131Q124 121 135 131Z" fill="#1A1446"/>
    <circle cx="162" cy="117" r="6.5" fill="#1A1446"/>
    <path d="M151 131Q162 121 173 131Z" fill="#1A1446"/>
    <!-- stripe and lights -->
    <rect x="52" y="148" width="156" height="7" rx="3.5" fill="#0B7A75"/>
    <rect x="203" y="137" width="11" height="8" rx="4" fill="#FFD23F"/>
    <rect x="44" y="140" width="7" height="9" rx="3.5" fill="#FF3B5C"/>
    <!-- wheels -->
    <circle cx="82" cy="178" r="20" fill="#1A1446" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="82" cy="178" r="7.5" fill="#FFD23F"/>
    <circle cx="180" cy="178" r="20" fill="#1A1446" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="180" cy="178" r="7.5" fill="#FFD23F"/>

    <!-- location pin -->
    <path d="M144 90C132 76 124 67 124 56A20 20 0 1 1 164 56C164 67 156 76 144 90Z" fill="#FFFFFF"/>
    <circle cx="144" cy="56" r="8" fill="#FF4F6D"/>
  </g>
</svg>
