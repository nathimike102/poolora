name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/poolora-backend
  ML_IMAGE: ghcr.io/${{ github.repository_owner }}/poolora-ml

jobs:
  # ─── Backend: Lint, Test, Build ──────────────────────────────────────────
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm run test

      - name: Build Project
        run: npm run build

  # ─── Frontend: Typecheck + Test ──────────────────────────────────────────
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm run test

  # ─── Website: Typecheck + Build ──────────────────────────────────────────
  web-landing-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-landing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web-landing/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build (includes typecheck)
        run: npm run build

  # ─── Dependency vulnerability audit ─────────────────────────────────────
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit production dependencies
        run: |
          for dir in backend frontend web-landing; do
            echo "::group::npm audit $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
            echo "::endgroup::"
          done

      - name: Audit ML service dependencies
        run: |
          pip install pip-audit
          pip-audit -r ml-service/requirements.txt

  # ─── ML Service: Lint + Test ─────────────────────────────────────────────
  ml-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Verify ML Service Starts and Requires Internal Key
        env:
          ML_SERVICE_API_KEY: ci-test-key
        run: |
          pip install httpx
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get('/health').status_code == 200
          assert c.post('/api/predict-demand', json={}).status_code == 401
          print('ML service OK')
          "

  # ─── Docker Build & Push ─────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-checks, ml-checks, dependency-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ML Image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: true
          tags: |
            ${{ env.ML_IMAGE }}:latest
            ${{ env.ML_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Production ───────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - name: Skip when no server is configured
        if: env.EC2_HOST == ''
        run: echo "::notice::EC2_HOST is not set, so nothing was deployed. Add EC2_HOST, EC2_USER and EC2_SSH_KEY to enable deploys."

      - name: Checkout Code
        if: env.EC2_HOST != ''
        uses: actions/checkout@v4

      - name: Deploy via SSH
        if: env.EC2_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            echo "Starting deployment..."
            cd /home/ubuntu/Poolora

            # Pull latest code
            git pull origin main

            # Pull latest Docker images
            docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            docker pull ${{ env.ML_IMAGE }}:${{ github.sha }}

            # Update running containers
            cd backend
            docker compose pull
            docker compose up -d --remove-orphans

            # Restart nginx
            sudo systemctl restart nginx

            echo "Deployment completed successfully"
