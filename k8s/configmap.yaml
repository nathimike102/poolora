apiVersion: v1
kind: ConfigMap
metadata:
  name: poolora-config
  namespace: poolora
data:
  NODE_ENV: "production"
  PORT: "5002"
  # Public API origin. Used for links sent to people, e.g. SOS live tracking.
  # Set to the API's public origin before applying. Must not be left as-is.
  APP_BASE_URL: "https://API_HOST_PLACEHOLDER"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka-0.kafka-headless:9092"
  KAFKA_CLIENT_ID: "mobility-backend"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  AUTH_PROVIDER: "hybrid"
  PLATFORM_FEE_RATE: "0.15"
  # Comma-separated. The marketing site is served by Vercel.
  CORS_ORIGIN: "https://poolora.vercel.app"
  ML_SERVICE_URL: "http://poolora-ml:8000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: poolora
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'poolora-backend'
        metrics_path: /metrics
        static_configs:
          - targets: ['poolora-backend:5002']
            labels:
              service: backend

      - job_name: 'poolora-ml'
        metrics_path: /metrics
        static_configs:
          - targets: ['poolora-ml:8000']
            labels:
              service: ml-engine

      - job_name: 'mongodb'
        static_configs:
          - targets: ['mongodb:27017']

      - job_name: 'redis'
        static_configs:
          - targets: ['redis:6379']