apiVersion: v1
kind: ConfigMap
metadata:
  name: sanchari-config
  namespace: sanchari
data:
  NODE_ENV: "production"
  PORT: "3000"
  MONGODB_URI: "mongodb://mongodb-0.mongodb,mongodb-1.mongodb,mongodb-2.mongodb:27017/sanchari?replicaSet=rs0"
  REDIS_URL: "redis://redis-0.redis,redis-1.redis,redis-2.redis:6379"
  KAFKA_BROKERS: "kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092"
  ELASTICSEARCH_NODE: "http://elasticsearch-0.elasticsearch:9200"
  JWT_SECRET: "your-jwt-secret-here"
  FIREBASE_PROJECT_ID: "your-firebase-project-id"
  STRIPE_SECRET_KEY: "your-stripe-secret-key"
  GOOGLE_MAPS_API_KEY: "your-google-maps-api-key"