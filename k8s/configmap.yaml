apiVersion: v1
kind: ConfigMap
metadata:
  name: sanchari-config
  namespace: sanchari
data:
  NODE_ENV: "production"
  PORT: "5002"
  # Public API origin. Used for links sent to people, e.g. SOS live tracking.
  APP_BASE_URL: "https://api.sanchari.me"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka-0.kafka-headless:9092"
  KAFKA_CLIENT_ID: "mobility-backend"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  AUTH_PROVIDER: "hybrid"
  PLATFORM_FEE_RATE: "0.15"
  CORS_ORIGIN: "https://sanchari.me,https://www.sanchari.me"
  ML_SERVICE_URL: "http://sanchari-ml:8000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sanchari
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'sanchari-backend'
        metrics_path: /metrics
        static_configs:
          - targets: ['sanchari-backend:5002']
            labels:
              service: backend

      - job_name: 'sanchari-ml'
        metrics_path: /metrics
        static_configs:
          - targets: ['sanchari-ml:8000']
            labels:
              service: ml-engine

      - job_name: 'mongodb'
        static_configs:
          - targets: ['mongodb:27017']

      - job_name: 'redis'
        static_configs:
          - targets: ['redis:6379']