apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: sanchari
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: db-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-init
        image: mongo:7.0
        command: ["bash", "-c"]
        # Idempotent: waits for member 0, then initiates the replica set only if
        # it has not been initiated yet.
        args:
        - |
          set -euo pipefail
          until mongosh --quiet --host mongodb-0.mongodb -u "$MONGO_USER" -p "$MONGO_PASS" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
            echo "waiting for mongodb-0"; sleep 5
          done
          mongosh --quiet --host mongodb-0.mongodb -u "$MONGO_USER" -p "$MONGO_PASS" --authenticationDatabase admin --eval '
            try {
              rs.status();
              print("replica set already initiated");
            } catch (e) {
              if (e.codeName !== "NotYetInitialized") throw e;
              rs.initiate({
                _id: "rs0",
                members: [
                  { _id: 0, host: "mongodb-0.mongodb:27017", priority: 2 },
                  { _id: 1, host: "mongodb-1.mongodb:27017" },
                  { _id: 2, host: "mongodb-2.mongodb:27017" }
                ]
              });
              print("replica set initiated");
            }'
        env:
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: sanchari-secrets
              key: MONGO_USER
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              name: sanchari-secrets
              key: MONGO_PASS
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
