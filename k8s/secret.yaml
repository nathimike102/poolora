apiVersion: v1
kind: Secret
metadata:
  name: sanchari-secrets
  namespace: sanchari
type: Opaque
stringData:
  # ─── MongoDB ──────────────────────────────────────────────────────
  MONGO_USER: "admin"
  MONGO_PASS: "CHANGE_ME_STRONG_PASSWORD"
  MONGO_URI: "mongodb://admin:CHANGE_ME@mongodb-0.mongodb:27017/mobility?authSource=admin&retryWrites=true&w=majority"

  # ─── Redis ────────────────────────────────────────────────────────
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"

  # ─── JWT ──────────────────────────────────────────────────────────
  JWT_ACCESS_SECRET: "CHANGE_ME_ACCESS_SECRET_64_CHARS_MIN"
  JWT_REFRESH_SECRET: "CHANGE_ME_REFRESH_SECRET_64_CHARS_MIN"
  JWT_ACCESS_EXPIRY: "15m"
  JWT_REFRESH_EXPIRY: "7d"

  # ─── Firebase ─────────────────────────────────────────────────────
  FIREBASE_PROJECT_ID: "CHANGE_ME"
  FIREBASE_SERVICE_ACCOUNT_PATH: "/app/secrets/firebase-service-account.json"

  # ─── Razorpay ─────────────────────────────────────────────────────
  RAZORPAY_KEY_ID: "CHANGE_ME"
  RAZORPAY_KEY_SECRET: "CHANGE_ME"
  RAZORPAY_WEBHOOK_SECRET: "CHANGE_ME"

  # ─── AWS S3 ───────────────────────────────────────────────────────
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_REGION: "ap-south-1"
  AWS_S3_BUCKET: "mobility-uploads-prod"

  # ─── Twilio ───────────────────────────────────────────────────────
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"
  TWILIO_PHONE_NUMBER: "CHANGE_ME"

  # ─── Google Maps ──────────────────────────────────────────────────
  GOOGLE_MAPS_API_KEY: "CHANGE_ME"

  # ─── FCM ──────────────────────────────────────────────────────────
  FCM_SERVER_KEY: "CHANGE_ME"