apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: siham-backend-pdb
  namespace: siham
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: siham-backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongodb-pdb
  namespace: siham
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mongodb

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: siham
spec:
  # Single instance: allow voluntary evictions so node drains are not blocked.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: redis