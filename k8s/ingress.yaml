# Public entry point for the API only. The marketing site is
# served by Vercel. The ML service and Grafana are internal and have no ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poolora-ingress
  namespace: poolora
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Long timeouts keep Socket.io websocket connections open
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - API_HOST_PLACEHOLDER
    secretName: poolora-api-tls
  rules:
  - host: API_HOST_PLACEHOLDER
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: poolora-backend
            port:
              number: 5002
