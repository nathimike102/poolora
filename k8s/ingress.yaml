apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sanchari-ingress
  namespace: sanchari
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.sanchari.com
    - app.sanchari.com
    secretName: sanchari-tls
  rules:
  - host: api.sanchari.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sanchari-backend
            port:
              number: 3000
  - host: app.sanchari.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sanchari-frontend
            port:
              number: 80