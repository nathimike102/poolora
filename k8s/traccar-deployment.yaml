# Car tracker gateway: Traccar as a forwarder only (infra/traccar/README.md).
# It decodes car GPS trackers and posts each position to the backend; it
# stores nothing, so one replica is enough and a restart loses nothing.
#
# Create the config from infra/traccar/traccar.example.xml first:
#   kubectl -n siham create secret generic traccar-config --from-file=traccar.xml=infra/traccar/traccar.xml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siham-traccar
  namespace: siham
  labels:
    app: siham-traccar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siham-traccar
  template:
    metadata:
      labels:
        app: siham-traccar
    spec:
      containers:
      - name: traccar
        image: traccar/traccar:6
        ports:
        - { containerPort: 5023, name: gt06 }
        - { containerPort: 5027, name: teltonika }
        - { containerPort: 5013, name: h02 }
        - { containerPort: 5055, name: osmand }
        - { containerPort: 5039, name: wialon }
        volumeMounts:
        - name: config
          mountPath: /opt/traccar/conf/traccar.xml
          subPath: traccar.xml
          readOnly: true
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 500m, memory: 512Mi }
      volumes:
      - name: config
        secret:
          secretName: traccar-config
---
# Trackers connect from the internet over plain TCP
apiVersion: v1
kind: Service
metadata:
  name: siham-traccar
  namespace: siham
spec:
  type: LoadBalancer
  selector:
    app: siham-traccar
  ports:
  - { name: gt06, port: 5023, targetPort: 5023, protocol: TCP }
  - { name: teltonika, port: 5027, targetPort: 5027, protocol: TCP }
  - { name: h02, port: 5013, targetPort: 5013, protocol: TCP }
  - { name: osmand, port: 5055, targetPort: 5055, protocol: TCP }
  - { name: wialon, port: 5039, targetPort: 5039, protocol: TCP }
