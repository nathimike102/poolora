apiVersion: apps/v1
kind: Deployment
metadata:
  name: poolora-backend
  namespace: poolora
  labels:
    app: poolora-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: poolora-backend
  template:
    metadata:
      labels:
        app: poolora-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5002"
        prometheus.io/path: "/metrics"
    spec:
      # GHCR images are private by default; scripts/deploy-k8s.sh creates this secret
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: backend
        image: ghcr.io/nathimike102/poolora-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5002
          name: http
        envFrom:
        - configMapRef:
            name: poolora-config
        - secretRef:
            name: poolora-secrets
        env:
        - name: ML_SERVICE_URL
          value: "http://poolora-ml:8000"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: firebase-sa
          mountPath: /app/secrets
          readOnly: true
      volumes:
      - name: firebase-sa
        secret:
          secretName: firebase-service-account
          optional: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - poolora-backend
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30